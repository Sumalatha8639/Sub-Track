spring:
  application:
    name: subtrack
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/subtrack?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:subtrack}
    password: ${DB_PASSWORD:subtrack}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Default: Mailpit on this PC (emails show at http://localhost:8025).
  # To send real emails in a demo (e.g. Gmail with an app password), see README "Real emails".
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # The app works without a mail server (emails are retried later), so it isn't "down"
      enabled: false

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  default-timezone: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me-0123456789}
    access-token-minutes: 15
    refresh-token-days: 7
  jobs:
    secret: ${JOB_SECRET:local-job-secret}
  mail:
    from: ${MAIL_FROM:SubTrack <no-reply@subtrack.local>}
  reminders:
    send-hour: ${REMINDER_SEND_HOUR:9}
    overdue-nudge-max-days: 30
  auth:
    verification-token-hours: 24
    reset-token-minutes: 30
    # The frontend (5173) and backend (8080) run on the same PC over http: Lax, not Secure.
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
